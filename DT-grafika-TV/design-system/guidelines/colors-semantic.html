<style>*{box-sizing:border-box}body{margin:0;background:var(--svdt-bg);font-family:var(--svdt-font);display:flex;gap:10px;padding:20px}

.sw span{font-size:10px;font-weight:900;color:#000;background:rgba(255,255,255,.75);padding:3px 7px;border-radius:4px}</style>
<div class="sw" style="background:var(--svdt-ok)"><span>ok · #2EE08A</span></div>
<div class="sw" style="background:var(--svdt-warn)"><span>warn · #FCB900</span></div>
<div class="sw" style="background:var(--svdt-err)"><span>err · #FF6B6B</span></div>
