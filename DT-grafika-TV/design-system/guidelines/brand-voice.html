<!-- @dsCard group="Brand" viewport="700x220" name="Tone of voice" subtitle="Direct, second-person, uppercase calls to action" -->
<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--svdt-bg);font-family:var(--svdt-font);padding:0;display:grid;grid-template-columns:1fr 1fr}
div{padding:22px 24px}.y{background:rgba(0,200,110,.05);border-right:1px solid var(--svdt-border)}.n{background:rgba(227,6,19,.05)}
h4{margin:0 0 12px;font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
.y h4{color:#2ee08a}.n h4{color:#ff5c5c}
ul{margin:0;padding-left:18px;color:var(--svdt-text-soft);font-size:13px;line-height:1.9}</style>
<div class="y"><h4>Do</h4><ul><li>Short, second person: "Zažij atmosféru."</li><li>Uppercase for CTAs and headings</li><li>Concrete numbers: 140 riders, 25+ obstacles</li></ul></div>
<div class="n"><h4>Don't</h4><ul><li>Formal, impersonal language</li><li>Long sentences in headings</li><li>Stacked exclamation marks, clichés</li></ul></div>
