<!doctype html><html lang="cs"><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--svdt-bg);color:#fff;font-family:var(--svdt-font);padding:0;box-sizing:border-box;display:flex;align-items:flex-end}
.step{flex:1;position:relative;height:100%;border-right:1px solid var(--svdt-border);display:flex;align-items:flex-end;justify-content:center;padding-bottom:26px}
.step:last-child{border:0}
.card{position:relative;width:150px;height:44px;background:var(--svdt-tv-surface);border-top:1px solid var(--svdt-tv-hairline);isolation:isolate}
.architecture{right:6px;width:140px;height:52px;top:-51px}
.l{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.07em;color:var(--svdt-text-soft)}</style>
<body>
<div class="step"><div class="card"><div class="architecture"><i class="edge"></i><i class="face"></i></div></div><div class="l">KLID</div></div>
<div class="step"><div class="card"><div class="architecture"><i class="edge" style="clip-path:inset(0 45% 0 0)"></i><i class="face" style="clip-path:inset(0 45% 0 0)"></i></div></div><div class="l">+150 MS · SILUETA SE ROZKRESLUJE</div></div>
<div class="step"><div class="card" style="opacity:.3;transform:translateY(14px)"></div><div class="l">380 MS · KARTA JE PRYČ</div></div>
</body></html>
