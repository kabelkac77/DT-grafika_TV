<!doctype html><html lang="cs"><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>html,body{margin:0}body{background:var(--svdt-bg);color:var(--svdt-text);font-family:var(--svdt-font);padding:20px 24px;box-sizing:border-box}</style><style>.row{display:flex;gap:14px}.chip{flex:1;border:1px solid var(--svdt-border);padding:14px 16px}.d{width:12px;height:12px;margin-bottom:12px}.n{font-size:11px;letter-spacing:.08em;font-weight:800}.v{font-size:11px;color:var(--svdt-text-soft);margin-top:6px;font-variant-numeric:tabular-nums}</style><body><div class="row">
