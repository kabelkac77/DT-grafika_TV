<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SVDT — časomíra</title><link rel="stylesheet" href="../karta-jezdce/style.css"><link rel="stylesheet" href="style.css"></head><body>
<header class="page-head"><div><p class="eyebrow">SVDT / G04 / ČASOMÍRA</p><h1>Čas jízdy.</h1><p><a href="../index.html">Všechny grafiky</a></p></div></header>
<main><section class="controls" aria-label="Editor časomíry"><label>Ukázkový čas (m:ss.mmm)<input id="time" inputmode="decimal" maxlength="9" value="1:23.456"></label><label>Pozadí<select id="background"><option value="neutral">Záběr trati</option><option value="light">Světlé</option><option value="dark">Tmavé</option><option value="transparent">Průhledné</option></select></label><button id="toggle" type="button">Skrýt kartu</button><button id="link" type="button">Uložit údaje do odkazu</button></section>

<p id="status" class="status" role="status"></p><footer>Hodnota je pouze ukázková a sama neběží. PNG vytvoříte přes Actions nebo npm run render:casomira. Animace a napojení na časomíru následují po upřesnění.</footer></main><script src="data.js"></script><script src="app.js"></script></body></html>
