name: SVDT — nasazení GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "DT-grafika-TV/docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publikovat docs/ na GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4

      - name: Připravit GitHub Pages
        uses: actions/configure-pages@v5

      - name: Zabalit docs/ jako artefakt
        uses: actions/upload-pages-artifact@v3
        with:
          path: DT-grafika-TV/docs

      - name: Nasadit na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
