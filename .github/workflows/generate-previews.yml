name: SVDT — generování náhledů

on:
  workflow_dispatch:
    inputs:
      split_json:
        description: 'Údaje G08 jako JSON podle split-time/data.js (nepovinné)'
        required: false
        type: string
      timer_time:
        description: 'Ukázkový čas, např. 1:23.456 (nepovinné)'
        required: false
        type: string
      guest_name:
        description: 'Jméno hosta pro vlastní PNG (nepovinné)'
        required: false
        type: string
      guest_role:
        description: 'Funkce hosta (nepovinné)'
        required: false
        type: string
      results_category:
        description: 'Kategorie výsledků (nepovinné)'
        required: false
        type: string
      results_run_type:
        description: 'Typ jízdy výsledků (nepovinné)'
        required: false
        type: string
      results_json:
        description: 'Celý datový objekt výsledků jako JSON (nepovinné)'
        required: false
        type: string
  pull_request:
    paths:
      - "DT-grafika-TV/karta-jezdce/**"
      - "DT-grafika-TV/karta-hosta/**"
      - "DT-grafika-TV/karta-vysledky/**"
      - "DT-grafika-TV/časomíra/**"
      - "DT-grafika-TV/split-time/**"
      - "DT-grafika-TV/render.cjs"
      - "design-system/brand/**"
      - "DT-grafika-TV/scripts/**"
      - "DT-grafika-TV/package.json"
      - ".github/workflows/generate-previews.yml"
  push:
    branches:
      - main
    paths:
      - "DT-grafika-TV/karta-jezdce/**"
      - "DT-grafika-TV/karta-hosta/**"
      - "DT-grafika-TV/karta-vysledky/**"
      - "DT-grafika-TV/časomíra/**"
      - "DT-grafika-TV/split-time/**"
      - "DT-grafika-TV/render.cjs"
      - "design-system/brand/**"
      - "DT-grafika-TV/scripts/**"
      - "DT-grafika-TV/package.json"
      - ".github/workflows/generate-previews.yml"

permissions:
  contents: read

jobs:
  render:
    name: Vyrenderovat a zkontrolovat všechny karty
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Načíst repozitář
        uses: actions/checkout@v4

      - name: Připravit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Nainstalovat závislosti
        working-directory: DT-grafika-TV
        run: npm install --no-audit --no-fund

      - name: Nainstalovat Chromium
        working-directory: DT-grafika-TV
        run: npx playwright install --with-deps chromium

      - name: Vygenerovat a zkontrolovat náhledy
        working-directory: DT-grafika-TV
        env:
          SPLIT_JSON: ${{ inputs.split_json }}
          TIMER_TIME: ${{ inputs.timer_time }}
          GUEST_NAME: ${{ inputs.guest_name }}
          GUEST_ROLE: ${{ inputs.guest_role }}
          RESULTS_CATEGORY: ${{ inputs.results_category }}
          RESULTS_RUN_TYPE: ${{ inputs.results_run_type }}
          RESULTS_JSON: ${{ inputs.results_json }}
        run: npm run render

      - name: Uložit náhledy ke stažení
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: svdt-grafika-nahledy
          path: |
            DT-grafika-TV/karta-jezdce/nahledy/
            DT-grafika-TV/karta-jezdce/kontrola.json
            DT-grafika-TV/karta-hosta/nahledy/
            DT-grafika-TV/karta-hosta/kontrola.json
            DT-grafika-TV/karta-vysledky/nahledy/
            DT-grafika-TV/karta-vysledky/kontrola.json
            DT-grafika-TV/časomíra/nahledy/
            DT-grafika-TV/časomíra/kontrola.json
            DT-grafika-TV/split-time/nahledy/
            DT-grafika-TV/split-time/kontrola.json
          if-no-files-found: error
          retention-days: 30
