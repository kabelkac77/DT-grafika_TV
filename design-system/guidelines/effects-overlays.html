<!-- @dsCard group="Spacing" viewport="700x180" name="Photo overlays" subtitle="Text over a photo always needs at least a 55% dark overlay" -->
<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--svdt-bg);font-family:var(--svdt-font);padding:20px;display:flex;gap:12px}
.p{flex:1;height:130px;border-radius:var(--svdt-radius);position:relative;overflow:hidden;border:1px solid var(--svdt-border)}
.img{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,#4a5568 0,transparent 45%),radial-gradient(circle at 70% 65%,#2d3748 0,transparent 50%),linear-gradient(135deg,#5a6472,#20262e)}
.lbl{position:absolute;left:0;right:0;bottom:0;padding:10px;font-size:10px;font-family:ui-monospace,Consolas,monospace;color:#fff}</style>
<div class="p"><div class="img"></div><div style="position:absolute;inset:0;background:rgba(5,6,10,.55)"></div><div class="lbl">flat .55 — text over photo</div></div>
<div class="p"><div class="img"></div><div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,6,10,0) 35%,rgba(5,6,10,.95) 100%)"></div><div class="lbl">bottom gradient — card title</div></div>
<div class="p"><div class="img"></div><div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(227,6,19,.75),rgba(5,6,10,.2))"></div><div class="lbl">brand overlay — hero, poster</div></div>
