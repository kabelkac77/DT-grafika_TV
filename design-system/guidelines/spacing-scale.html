<!-- @dsCard group="Spacing" viewport="700x260" name="Scale" subtitle="4px grid, 72px section rhythm" -->
<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--svdt-bg);font-family:var(--svdt-font);padding:20px;display:flex;flex-direction:column;gap:8px}
.r{display:flex;align-items:center;gap:14px}
i{height:16px;background:linear-gradient(90deg,var(--svdt-brand),var(--svdt-red));border-radius:3px;display:block}
code{font-size:11px;color:#fff;width:130px;font-family:ui-monospace,Consolas,monospace}
span{font-size:11px;color:var(--svdt-text-muted)}</style>
<div class="r"><code>space-1 · 4px</code><i style="width:4px"></i></div>
<div class="r"><code>space-3 · 12px</code><i style="width:12px"></i></div>
<div class="r"><code>space-5 · 24px</code><i style="width:24px"></i></div>
<div class="r"><code>space-7 · 48px</code><i style="width:48px"></i></div>
<div class="r"><code>space-8 · 72px</code><i style="width:72px"></i><span>vertical section rhythm</span></div>
<div class="r"><code>space-9 · 96px</code><i style="width:96px"></i></div>
