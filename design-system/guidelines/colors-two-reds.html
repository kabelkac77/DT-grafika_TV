<!-- @dsCard group="Colors" viewport="700x220" name="Two reds" subtitle="Brand red (logo, CTA, print) vs accent red (glow, hover, numerals)" -->
<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--svdt-bg);font-family:var(--svdt-font);display:flex;gap:14px;padding:20px}
.role{flex:1;border-radius:var(--svdt-radius);overflow:hidden;color:#fff}
.role .h{padding:18px}
.role b{display:block;font-size:18px;font-weight:900;text-transform:uppercase}
.role small{font-size:11px;font-weight:700;opacity:.85}
.role ul{margin:0;padding:14px 18px;background:var(--svdt-bg-card);list-style:none;font-size:12.5px;color:var(--svdt-text-soft);line-height:1.9}
</style>
<div class="role"><div class="h" style="background:#e30613"><b>Brand red</b><small>#E30613 · --svdt-brand</small></div><ul><li>Logo, primary CTA</li><li>Full-colour surfaces</li><li>All print</li></ul></div>
<div class="role"><div class="h" style="background:#ff1a1a"><b>Accent red</b><small>#FF1A1A · --svdt-red</small></div><ul><li>Glow, hover, active links</li><li>Numerals, countdowns</li><li>Never as small-text background</li></ul></div>
