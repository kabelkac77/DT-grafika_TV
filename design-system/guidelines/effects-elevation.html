<link rel="stylesheet" href="../styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--svdt-bg);font-family:var(--svdt-font);padding:20px;display:flex;gap:16px}
.d{flex:1;text-align:center}.box{height:80px;border-radius:8px;background:var(--svdt-bg-card-soft);border:1px solid var(--svdt-border);margin-bottom:10px}
span{font-size:10.5px;color:var(--svdt-text-muted)}</style>
<div class="d"><div class="box"></div><span>flat · default card</span></div>
<div class="d"><div class="box" style="box-shadow:var(--svdt-shadow-card)"></div><span>shadow-card · over photo</span></div>
<div class="d"><div class="box" style="border-color:var(--svdt-red);box-shadow:0 0 24px var(--svdt-red-glow)"></div><span>shadow-glow · hover/active</span></div>
